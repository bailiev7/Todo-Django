services:
  db:
    image: postgres:16-alpine
    container_name: mysite_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysite}
      POSTGRES_USER: ${POSTGRES_USER:-mysite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mysite} -d ${POSTGRES_DB:-mysite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    container_name: mysite_web
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1,http://localhost}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Europe/Moscow}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-Todo Home List <noreply@localhost>}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-25}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-False}
      DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-False}
      DJANGO_EMAIL_TIMEOUT: ${DJANGO_EMAIL_TIMEOUT:-15}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_API_URL: ${YOOKASSA_API_URL:-https://api.yookassa.ru/v3}
      YOOKASSA_TIMEOUT: ${YOOKASSA_TIMEOUT:-10}
      YOOKASSA_SEND_RECEIPT: ${YOOKASSA_SEND_RECEIPT:-False}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-1}
      YOOKASSA_PAYMENT_SUBJECT: ${YOOKASSA_PAYMENT_SUBJECT:-service}
      DONATION_FAKE_GATEWAY: ${DONATION_FAKE_GATEWAY:-True}
      DONATION_CURRENCY: ${DONATION_CURRENCY:-RUB}
      DONATION_MIN_AMOUNT: ${DONATION_MIN_AMOUNT:-50.00}
      DONATION_MAX_AMOUNT: ${DONATION_MAX_AMOUNT:-100000.00}
      DONATION_SUGGESTED_AMOUNTS: ${DONATION_SUGGESTED_AMOUNTS:-100,300,500,1000}
      POSTGRES_DB: ${POSTGRES_DB:-mysite}
      POSTGRES_USER: ${POSTGRES_USER:-mysite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: mysite_nginx
    restart: unless-stopped
    ports:
      - "${DJANGO_PORT:-8000}:80"
    volumes:
      - ./mysite.nginx:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
