{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пароль изменён</title>
    <link rel="stylesheet" href="{% static 'todo/css/todo_home_list.css' %}">
    <link rel="stylesheet" href="{% static 'todo/css/cookie-consent.css' %}">
</head>
<body data-active-form="reset">
    <div class="background-stage">
        <div class="slide one"></div>
        <div class="slide two"></div>
        <div class="slide three"></div>
    </div>
    <div class="noise"></div>

    <main class="page auth-page">
        <section class="auth-shell reset-shell">
            <div class="auth-inner">
                <div class="auth-header">
                    <div>
                        <h2>Пароль изменён</h2>
                        <p>Теперь можно войти в аккаунт с новым паролем.</p>
                    </div>
                </div>

                <a class="submit-link" href="{% url 'todo_home_list' %}">Войти</a>
            </div>
        </section>
    </main>

    <script src="{% static 'todo/js/cookie-consent.js' %}"></script>
    <div id="cookie-consent-banner" class="cookie-consent hidden">
        <div class="cookie-consent-text">
            <p>
                Мы используем файлы cookie для улучшения вашего опыта на сайте.
                Нажимая "Принять", вы соглашаетесь с использованием cookies.
                Подробнее в <a href="{% url 'privacy_policy' %}">политике конфиденциальности</a>.
            </p>
        </div>
        <div class="cookie-consent-actions">
            <button id="cookie-consent-decline" class="cookie-consent-decline">Отклонить</button>
            <button id="cookie-consent-accept" class="cookie-consent-accept">Принять</button>
        </div>
    </div>
